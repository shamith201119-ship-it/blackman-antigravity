name: Daily AI Instagram Reel Engine

on:
  schedule:
    # Runs everyday at 09:00 UTC
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (ImageMagick & FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          # Fix ImageMagick security policy for MoviePy text rendering if needed
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Reel Generation & Direct Publishing Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PROFILE_NAME: ${{ secrets.BUFFER_PROFILE_NAME || 'blackman_officialpage' }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID || '6a0c75a6090476fb99383a66' }}
        run: |
          python main.py
