name: Daily Reel Generation

on:
  schedule:
    # 7 PM local (UTC+5:30) => 13:30 UTC daily
    - cron: "30 13 * * *"
  workflow_dispatch:  # manual trigger for testing

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    env:
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      BUFFER_PROFILE_ID: ${{ secrets.BUFFER_PROFILE_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Reel Engine
        run: |
          python main.py
      # No automatic commit step as per user request
