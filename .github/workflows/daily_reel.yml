name: Daily Reel Generation
concurrency:
  group: daily-reel
  cancel-in-progress: true

on:
  schedule:
    # 7:10 PM local (UTC+5:30) => 13:40 UTC daily
    - cron: "40 13 * * *"
  workflow_dispatch:  # manual trigger for testing

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    env:
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID || secrets.BUFFER_PROFILE_ID }}
      BUFFER_PROFILE_ID: ${{ secrets.BUFFER_CHANNEL_ID || secrets.BUFFER_PROFILE_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY || secrets.XAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Reel Engine
        run: |
          python main.py
      # No automatic commit step as per user request
