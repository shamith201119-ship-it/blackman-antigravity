name: Auto Post Reels to Instagram

on:
  schedule:
    # 7:00 PM IST (1:30 PM UTC) — only schedule, with 0-30 min random delay
    - cron: '30 13 * * *'

  # Allows manual triggers from GitHub UI
  workflow_dispatch:

jobs:
  publish-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          # Fix ImageMagick security policy for text rendering
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i '/<policy domain="coder" rights="none" pattern="[A-Z]*"/d' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Randomize Posting Time (0 - 30 Min Delay)
        run: |
          python -c "import time, random; delay = random.randint(0, 1800); print(f'Sleeping for {delay//60} minutes and {delay%60} seconds...'); time.sleep(delay)"

      - name: Generate & Publish Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_MEDIA_REPO: ${{ secrets.GITHUB_MEDIA_REPO }}
        run: |
          python main.py
